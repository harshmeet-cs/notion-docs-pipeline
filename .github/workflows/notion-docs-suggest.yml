name: Notion Docs — Suggest Updates

on:
  push:
    branches: [main]
  # Manual trigger — useful for reruns with extra context
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to analyze (defaults to HEAD)"
        required: false
      extra_context:
        description: "Extra guidance for Claude (e.g. 'Also update the permissions matrix')"
        required: false

jobs:
  suggest:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push the docs/notion-update-* branch
      pull-requests: write  # raise the docs PR

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT so the pushed branch can trigger pull_request events.
          # Falls back to GITHUB_TOKEN if GH_PAT is not set (PR trigger may not fire in that case).
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r scripts/requirements.txt

      - name: Analyze diff and raise docs PR
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          # Use GITHUB_TOKEN for push/PR — it has contents:write from the permissions block.
          # GH_PAT (if set) is only used at checkout so the docs PR can trigger other workflows.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ inputs.commit_sha || github.sha }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: main
          EXTRA_CONTEXT: ${{ inputs.extra_context || '' }}
          # Set MOCK_CLAUDE=true in repo variables to test without an LLM
          MOCK_CLAUDE: ${{ vars.MOCK_CLAUDE || 'false' }}
        run: python scripts/analyze_diff.py
