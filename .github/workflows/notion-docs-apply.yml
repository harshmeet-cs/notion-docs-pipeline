name: Notion Docs — Apply to Notion

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  apply:
    # Only fire when a docs/notion-update-* PR is merged (not closed without merge)
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'docs/notion-update-')
    runs-on: ubuntu-latest
    permissions:
      issues: write  # post the confirmation commit comment

    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the merged PR's head to get notion-changes.md as approved
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r scripts/requirements.txt

      - name: Apply changes to Notion
        env:
          NOTION_API_TOKEN: ${{ secrets.NOTION_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Use the source commit SHA (extracted from branch name) for the rollback command
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: python scripts/apply_notion.py

      - name: Upload rollback log
        uses: actions/upload-artifact@v4
        with:
          name: rollback-${{ github.event.pull_request.head.sha }}
          path: rollback_log.json
          retention-days: 90
